name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test with demo configuration
        run: ./gradlew --no-daemon -PdemoBuild=true testDebugUnitTest assembleDebug
      - name: Verify demo configuration before upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          config = Path('app/build/generated/source/buildConfig/debug/ru/vlad/triliumnotes/BuildConfig.java').read_text()
          assert 'TRILIUM_BASE_URL = "https://trilium.invalid";' in config, 'Unexpected demo endpoint'
          assert 'TRILIUM_TOKEN = "dummy-token";' in config, 'Unexpected demo token'
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              dex = b''.join(apk.read(name) for name in apk.namelist() if name.endswith('.dex'))
          assert b'https://trilium.invalid' in dex, 'Demo endpoint missing from APK'
          assert b'dummy-token' in dex, 'Demo token missing from APK'
          PY
      - name: Upload demo debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trilium-client-demo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
